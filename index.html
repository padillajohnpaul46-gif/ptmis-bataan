<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTMIS Bataan</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 20px; background: #f4f6f9; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 20px; border-radius: 8px; width: 400px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; }
        .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #003366; color: white; }
        .btn-danger { background: #d9534f; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2>PTMIS - Document Registry</h2>
    <button class="btn btn-primary" onclick="openModal()">+ Add New File Record</button>

    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Title</th>
                <th>Details</th>
                <th>Date</th>
                <th>File</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="recordsTableBody"></tbody>
    </table>
</div>

<div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
        <h3>Add New Record & Attach File</h3>
        <form id="uploadForm" onsubmit="uploadRecord(event)">
            <div class="form-group">
                <label>Category</label>
                <select id="modalCategory">
                    <option>Routes & Franchises</option>
                    <option>GIS Traffic & Accidents</option>
                    <option>EV Charging Stations</option>
                </select>
            </div>
            <div class="form-group">
                <label>Document Title</label>
                <input type="text" id="modalTitle" required>
            </div>
            <div class="form-group">
                <label>Details / Notes</label>
                <textarea id="modalDetails"></textarea>
            </div>
            <div class="form-group">
                <label>Attach File</label>
                <input type="file" id="modalFile">
            </div>
            <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save & Upload</button>
        </form>
    </div>
</div>

<script>
    // HARDCODED RENDER URL
    const API_URL = 'https://ptmis-bataan.onrender.com/api/records';
    const BASE_URL = 'https://ptmis-bataan.onrender.com';

    document.addEventListener('DOMContentLoaded', fetchRecords);

    function openModal() { document.getElementById('uploadModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('uploadModal').style.display = 'none'; }

    async function fetchRecords() {
        try {
            const res = await fetch(API_URL);
            const records = await res.json();
            const tableBody = document.getElementById('recordsTableBody');
            tableBody.innerHTML = '';

            records.forEach(r => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${r.category}</td>
                        <td>${r.title}</td>
                        <td>${r.details || ''}</td>
                        <td>${r.date}</td>
                        <td>${r.filePath !== '#' ? `<a href="${BASE_URL}${r.filePath}" target="_blank">📎 Download File</a>` : 'No file'}</td>
                        <td><button onclick="deleteRecord(${r.id})" class="btn btn-danger">Delete</button></td>
                    </tr>`;
            });
        } catch (e) { console.error('Error loading records:', e); }
    }

    async function uploadRecord(e) {
        e.preventDefault();

        const formData = new FormData();
        formData.append('category', document.getElementById('modalCategory').value);
        formData.append('title', document.getElementById('modalTitle').value);
        formData.append('details', document.getElementById('modalDetails').value);
        
        const fileInput = document.getElementById('modalFile');
        if (fileInput.files[0]) {
            formData.append('file', fileInput.files[0]);
        }

        try {
            const res = await fetch(API_URL, { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                alert('Uploaded successfully!');
                closeModal();
                fetchRecords();
            }
        } catch (err) { alert('Upload failed!'); }
    }

    async function deleteRecord(id) {
        if (!confirm('Delete record?')) return;
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchRecords();
    }
</script>
</body>
</html>
